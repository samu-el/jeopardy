<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#080A1F" />
    <title>Offline · Jeopardy</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <style>
      /* Hallmark · checked: the offline page, in the system from design.md · v2.0.0 */
      :root {
        color-scheme: dark;
        --color-paper: #080a1f; --color-paper-2: #0f1333; --color-ink: #f5f6ff; --color-ink-2: #b9bde0;
        --color-rule: #2a2f5e; --color-accent: #f2c14e; --color-accent-ink: #1a1200; --color-focus: #f2c14e;
        --font-display: "Oswald", "Arial Narrow", Impact, sans-serif;
        --font-body: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      html, body { margin: 0; background: var(--color-paper); color: var(--color-ink); overflow-x: clip; }
      body {
        min-height: 100vh;
        min-height: 100svh;
        box-sizing: border-box;
        padding: max(24px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
          max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: var(--font-body);
      }
      main {
        max-width: 28rem;
        text-align: center;
        background: var(--color-paper-2);
        border: 1px solid var(--color-rule);
        border-radius: 12px;
        padding: 32px 24px;
      }
      h1 {
        margin: 16px 0 8px;
        font-family: var(--font-display);
        text-transform: uppercase;
        letter-spacing: 0.01em;
        line-height: 1.05;
        font-size: 1.75rem;
      }
      p { margin: 0 0 24px; color: var(--color-ink-2); line-height: 1.5; }
      button {
        min-height: 48px;
        padding: 0 24px;
        border-radius: 8px;
        border: 1px solid var(--color-accent);
        background: var(--color-accent);
        color: var(--color-accent-ink);
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button:active { transform: translateY(1px); }
      button:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon.svg" alt="" width="72" height="72" />
      <h1>You're offline</h1>
      <p>Jeopardy rooms need a connection. Check your network, then try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
