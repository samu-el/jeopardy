<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>Offline · Jeopardy</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; background: #000; color: #fff; }
      body {
        min-height: 100vh;
        min-height: 100svh;
        box-sizing: border-box;
        padding: max(24px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
          max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      main {
        max-width: 28rem;
        text-align: center;
        background: #0b0f2a;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 8px;
        padding: 32px 24px;
      }
      h1 {
        margin: 16px 0 8px;
        font-family: "Arial Narrow", Impact, sans-serif;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        font-size: 1.75rem;
      }
      p { margin: 0 0 24px; color: rgba(255, 255, 255, 0.72); line-height: 1.5; }
      button {
        min-height: 48px;
        padding: 0 24px;
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        background: #3444e6;
        color: #fff;
        font: inherit;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        cursor: pointer;
      }
      button:focus-visible { outline: 3px solid #8a96ff; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon.svg" alt="" width="72" height="72" />
      <h1>You're offline</h1>
      <p>Jeopardy rooms need a connection. Check your network, then try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
