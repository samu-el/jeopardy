name: CI

# pull_request only: the push-to-main run repeated this on the merge commit the PR run had
# already checked. Vercel builds the app on every push and PR, so there is no `next build` here;
# the e2e suite starts `next dev` itself via Playwright's webServer.
on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_ENV: test
      # Playwright starts both servers itself: Next, and `wrangler dev` for
      # the rooms Durable Object the multiplayer specs run against.
      NEXT_PUBLIC_ROOMS_URL: http://127.0.0.1:8787
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Type check
        run: bun run typecheck
      - name: Type check the rooms Worker
        run: bun run typecheck:worker
      - name: Lint
        run: bun run lint
      - name: Unit & contract tests
        run: bun run test
      - name: Foundation verifier
        run: bun run foundation:verify
      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium
      - name: Playwright tests
        run: bun run test:e2e
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
